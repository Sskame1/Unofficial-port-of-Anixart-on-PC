<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Anixart</title>
  <!-- INLINE_STYLES -->
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="search-launch" id="global-search" type="button" aria-label="Поиск релизов">
        <span class="search-icon" aria-hidden="true"></span><span id="search-hint">Поиск аниме</span>
      </button>
      <div class="top-actions">
        <button class="icon-button" id="open-settings" type="button" aria-label="Настройки" title="Настройки"><span class="settings-icon" aria-hidden="true">⚙</span></button>
        <button class="icon-button" id="open-notifications" type="button" aria-label="Уведомления" title="Уведомления"><span class="bell-icon" aria-hidden="true">♧</span></button>
      </div>
    </header>
    <main id="screen-content" aria-live="polite"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Основная навигация"></nav>
  </div>
  <!-- INLINE_SCRIPTS -->
</body>
</html>
