[package]
name = "anixart-windows-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small Windows client for opening Anixart episodes"
build = "build.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.30"
wry = "0.45"
