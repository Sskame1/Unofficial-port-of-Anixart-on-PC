[package]
name = "anixart-windows-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small Windows client for opening Anixart episodes"
build = "build.rs"

[build-dependencies]
base64 = "0.22"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = true, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
base64 = "0.22"
sha2 = "0.10"
tao = "0.30"
wry = "0.45"
